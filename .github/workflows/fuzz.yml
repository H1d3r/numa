name: Fuzz

# Time-bounded libFuzzer runs over the hand-rolled wire parser. PRs that touch
# the parser get a short smoke run; a weekly cron does a deeper pass. Linux only
# — cargo-fuzz deadlocks pre-main under ASan on recent macOS.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/packet.rs'
      - 'src/header.rs'
      - 'src/question.rs'
      - 'src/record.rs'
      - 'src/svcb.rs'
      - 'src/wire.rs'
      - 'src/buffer.rs'
      - 'src/dnssec.rs'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to fuzz each target'
        default: '120'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ inputs.seconds || (github.event_name == 'schedule' && '300' || '60') }}
    strategy:
      fail-fast: false
      matrix:
        target: [packet_parse, packet_roundtrip, svcb_strip, dnssec_validate]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${FUZZ_SECONDS} -max_len=4096
      - name: Upload crash on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
